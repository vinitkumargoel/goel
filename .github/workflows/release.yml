# Release skeleton: builds, signs, notarizes and packages the macOS app for a
# version tag, and uploads the artifacts to the workflow run. It does NOT publish
# a GitHub release, sign the Sparkle update or touch the appcast — those remain
# the manual steps 8-12 of RELEASE.md until this has been proven on a real tag.
#
# It can only run for a pushed `v*` tag, and only inside the `release`
# environment. Configure that environment (Settings → Environments) with required
# reviewers and a tag rule of `v*` BEFORE adding any secret to it; the job then
# waits for a human to approve every run, and a fork or branch can never reach
# the signing identity.
#
# Required environment secrets (the job fails up front, naming any that are missing):
#   DEVELOPER_ID_P12_BASE64    base64 of the "Developer ID Application" .p12 export
#   DEVELOPER_ID_P12_PASSWORD  the .p12's export password
#   CODESIGN_IDENTITY          "Developer ID Application: Name (TEAMID)", exactly as
#                              `security find-identity -v -p codesigning` prints it
#   NOTARY_APPLE_ID            Apple ID used for notarization
#   NOTARY_TEAM_ID             the ten-character team ID
#   NOTARY_APP_PASSWORD        an app-specific password for that Apple ID
# Required environment variables (public values, not secrets):
#   SPARKLE_FEED_URL           https://…/appcast.xml
#   SPARKLE_ED_KEY             SUPublicEDKey (the PUBLIC half; the private key never
#                              leaves the maintainer's keychain)

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build, sign and notarize the macOS app
    # Belt and braces: the trigger already limits this to tags.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # build_app.sh derives CFBundleVersion from the commit count
          # The job holds the signing identity; no later step needs to push, so the
          # GITHUB_TOKEN must not linger in .git/config for any build script to read.
          persist-credentials: false

      - name: Every required secret and variable is configured
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_ED_KEY: ${{ vars.SPARKLE_ED_KEY }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD CODESIGN_IDENTITY NOTARY_APPLE_ID NOTARY_TEAM_ID \
                      NOTARY_APP_PASSWORD SPARKLE_FEED_URL SPARKLE_ED_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; missing=1; fi
          done
          exit "$missing"

      - name: Tag matches the version the build would stamp
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          [ "$(git describe --tags --exact-match)" = "$TAG" ]

      - name: Install build tools
        run: brew install cmake

      - name: Build the native dependencies against the 14.0 floor
        run: |
          Scripts/macos/build-deps.sh
          echo "GOEL_BREW_PREFIX=$PWD/Vendor/macos/arm64" >> "$GITHUB_ENV"

      # A throwaway keychain that exists only for this job and is deleted after it.
      - name: Import the signing identity
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/goel-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/id.p12"
          echo "GOEL_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store the notary credential
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials goel-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD" --keychain "$GOEL_KEYCHAIN"

      - name: Build, sign, notarize and staple the app
        env:
          GOEL_RELEASE: "1"
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_PROFILE: goel-notary
          BUNDLE_YTDLP: "1"
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_ED_KEY: ${{ vars.SPARKLE_ED_KEY }}
        run: Scripts/build_app.sh

      - name: Build, sign and notarize the DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_PROFILE: goel-notary
        run: Scripts/make_dmg.sh

      - name: Record the artifacts' digests
        run: |
          cd dist
          VERSION="${GITHUB_REF#refs/tags/v}"
          shasum -a 256 "Goel-Downloader-$VERSION-macos-arm64.dmg" \
                        "Goel-Downloader-$VERSION-macos-arm64.zip" > SHA256SUMS

      # Named explicitly, never a glob over dist/ (see RELEASE.md, Quick reference).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: |
            dist/Goel-Downloader-*-macos-arm64.dmg
            dist/Goel-Downloader-*-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Delete the temporary keychain
        if: always()
        run: |
          if [ -n "${GOEL_KEYCHAIN:-}" ]; then security delete-keychain "$GOEL_KEYCHAIN" || true; fi
