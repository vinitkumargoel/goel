# Continuous integration for Goel°.
#
# This exists because the two worst defects this project has shipped — vendored
# dylibs targeting a newer macOS than the app advertises, and artifacts signed
# with a certificate that is not valid for distribution — were both invisible on
# the machine that built them and would have been caught by a single unsigned
# build on a clean runner. RELEASE.md used to open with "There is no CI
# pipeline. This file IS the pipeline."; it is now the release procedure, and
# this file is the gate.
#
# Deliberately runs on macos-14, not the newest available image: Homebrew pours
# bottles for the OS of the machine that installs them, so a sonoma runner
# produces libtorrent/openssl/libssh2 with minos 14.0 — matching the app's
# LSMinimumSystemVersion. On a newer runner the deployment-target gate would
# fail honestly, which is the correct outcome but not a build we could ship.
#
# Nothing here is allowed to `|| true` past a missing tool. A step that passes
# because its checker was absent is worse than no step at all.
#
# Every third-party action is pinned to a full commit SHA (the tag it was taken
# from is in the trailing comment): a tag can be moved to different code after
# review, a commit cannot. Dependabot (.github/dependabot.yml) proposes bumps.

name: CI

on:
  push:
  pull_request:

# Least privilege: nothing in this workflow writes to the repository. A job that
# ever needs more must ask for it itself, in its own `permissions:` block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and gate
    # macos-15, not macos-14, because RemoteControlServer references
    # kSecImportToMemoryOnly. That constant is guarded at run time with
    # `if #available(macOS 15.0, *)`, but `#available` does not conjure a symbol
    # into an SDK that lacks it: against the macOS 14 SDK the file does not
    # compile at all. Building here therefore needs SDK 15+.
    #
    # That is also why the native dependencies are vendored below rather than
    # poured from Homebrew. A runner's bottles are built for the runner's OS, so
    # on macos-15 `brew install openssl@3` gives a libcrypto with minos 15.0,
    # which check_min_os.sh would rightly reject against our 14.0 floor. The two
    # requirements — a newer SDK to compile, older libraries to link — only hold
    # together if the libraries stop coming from the OS's package manager.
    runs-on: macos-15
    # ~30 minutes for the native dependencies on a cold cache, plus build and test.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # MANDATORY. Scripts/build_app.sh derives CFBundleVersion from
          # `git rev-list --count HEAD`; on the default shallow clone that is 1,
          # which is lower than the version already shipped and would make
          # Sparkle read the new release as older. build_app.sh now refuses such
          # a build outright, so a shallow clone fails the job rather than
          # producing a bad artifact.
          fetch-depth: 0

      # cmake builds them; the four libraries themselves are compiled from
      # pinned, checksummed source by the script below.
      - name: Install build tools
        run: brew install cmake

      # Keyed on the script, because the script is where the versions and their
      # digests live — bump a pin and the cache key changes with it. Only the
      # installed prefix is cached, not the unpacked sources, which are an order
      # of magnitude larger and are never read on a hit (the stamp files short
      # out each build).
      - name: Cache the vendored native libraries
        id: vendored
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Vendor/macos/arm64/opt
            Vendor/macos/arm64/lib
            Vendor/macos/arm64/.stamps
          key: macos-deps-${{ runner.os }}-arm64-${{ hashFiles('Scripts/macos/build-deps.sh') }}

      # ~30 minutes on a cold cache, seconds on a warm one. The script verifies
      # every dylib it produced against the floor before exiting, so a cache hit
      # that somehow held the wrong thing still fails here rather than surviving
      # to the gate.
      - name: Build the native dependencies against the 14.0 floor
        run: Scripts/macos/build-deps.sh

      - name: Use the vendored libraries for every later step
        run: echo "GOEL_BREW_PREFIX=$PWD/Vendor/macos/arm64" >> "$GITHUB_ENV"

      # The web portal is a React app in /portal, compiled into
      # Sources/GoelCore/Remote/Generated/PortalBundle.swift. That generated file
      # is committed so `swift build` works on a machine with no Node — which
      # means nothing stops someone editing the Swift copy directly, or changing
      # the React source and forgetting to rebuild. Either way the served portal
      # would no longer be the portal in the repository.
      #
      # Rebuilding here and diffing is what makes the committed file trustworthy.
      # The codegen is deterministic: same source in, byte-identical Swift out.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Build the web portal
        working-directory: portal
        run: |
          npm ci
          # Only what ships (the bundle compiled into PortalBundle.swift); dev tooling is
          # not redistributed. High and critical advisories fail the build.
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build

      - name: Fail if the committed portal bundle is stale
        run: |
          if ! git diff --quiet -- Sources/GoelCore/Remote/Generated/PortalBundle.swift; then
            echo "::error::PortalBundle.swift does not match a fresh build of /portal."
            echo "Run 'cd portal && npm run build' and commit the result."
            git diff --stat -- Sources/GoelCore/Remote/Generated/PortalBundle.swift
            exit 1
          fi

      # LocalizationTests already fails on a key that reached source without reaching the
      # table. This catches the other direction — rows left behind by a deleted call site,
      # and hand-edits to a generated file — which no test can see.
      - name: Fail if the committed base strings table is stale
        run: python3 Scripts/extract-l10n-keys.py --check

      # A language is offered in Settings only once it is (almost) fully translated:
      # "Deutsch" at 1% coverage gave German users an English UI with a German label.
      # Fails if any language in L10n.supportedLanguages is below 95%.
      - name: Offered languages meet the translation-coverage bar
        run: python3 Scripts/extract-l10n-keys.py --coverage-supported

      # Keyed on the manifest and the lockfile, and on build-deps.sh because the
      # vendored libraries are linked into the cached products. actions/cache only
      # saves after a green job, so every object restored here was compiled by a run
      # that also passed the warnings gate below: an unchanged file cannot hide one.
      - name: Cache the SwiftPM build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-${{ runner.os }}-arm64-${{ hashFiles('Package.resolved', 'Package.swift', 'Scripts/macos/build-deps.sh') }}
          restore-keys: |
            spm-${{ runner.os }}-arm64-

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      # Swift 6 language mode is not on yet (see CONTRIBUTING.md), so the compiler's
      # concurrency diagnostics are warnings. They must not accumulate: any warning
      # in our own Sources fails the job. Dependencies' warnings are not ours to fix.
      - name: Fail on Swift compiler warnings in Sources
        run: |
          grep -E '/Sources/[^:]+:[0-9]+:[0-9]+: warning:' build.log | sort -u > warnings.log || true
          if [ -s warnings.log ]; then
            echo "::error::the build produced Swift compiler warnings in Sources/"
            cat warnings.log
            exit 1
          fi

      - name: Fail on deployment-target link warnings
        run: |
          if grep -q 'which was built for newer version' build.log; then
            echo "::error::a linked dependency targets a newer macOS than this app"
            grep 'which was built for newer version' build.log
            exit 1
          fi

      # No floor yet: the total is published on every run so it can be watched, and a
      # floor added once the untested trust-boundary files have tests (CONTRIBUTING.md).
      - name: Test with code coverage
        run: swift test --enable-code-coverage

      - name: Coverage summary
        run: |
          BIN="$(swift build --show-bin-path)"
          PROFDATA="$BIN/codecov/default.profdata"
          XCTEST="$(find "$BIN" -maxdepth 1 -name '*PackageTests.xctest' -print -quit)"
          [ -f "$PROFDATA" ] || { echo "::error::no coverage profile at $PROFDATA"; exit 1; }
          [ -n "$XCTEST" ] || { echo "::error::no test bundle in $BIN"; exit 1; }
          EXE="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          xcrun llvm-cov report "$EXE" -instr-profile "$PROFDATA" \
            -ignore-filename-regex '(\.build|Tests|Generated)/' > coverage.txt
          cat coverage.txt
          TOTAL="$(grep '^TOTAL' coverage.txt)"
          echo "::notice title=Line coverage::$(echo "$TOTAL" | awk '{print $(NF-3)}') of lines in Sources/"
          {
            echo "### Code coverage (Sources/, generated code excluded)"
            echo '```'
            head -2 coverage.txt
            echo "$TOTAL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs with no bundle and no signing identity, so it gates every pull
      # request rather than only the ones that build an app.
      - name: Deployment-target comparator self-test
        run: Scripts/check_min_os.sh --self-test

      # The gate that would have caught the shipped-dylib defect. Needs no
      # certificate: CODESIGN_IDENTITY=- forces ad-hoc signing, and the bundled
      # yt-dlp/ffmpeg downloads are skipped to keep the job quick — neither
      # affects what is being measured.
      - name: Assemble the app bundle and check deployment targets
        env:
          GOEL_LOCAL_DEV: "0"
          BUNDLE_YTDLP: "0"
          BUNDLE_FFMPEG: "0"
          CODESIGN_IDENTITY: "-"
        run: |
          Scripts/build_app.sh
          Scripts/check_min_os.sh "dist/Goel°.app"

  # The Linux half of the product had no gate at all, which is how a daemon
  # tarball that could not start on Ubuntu 26.04 went unnoticed: the SONAMEs of
  # libtorrent and Boost encode upstream versions that change between releases,
  # so building on one Ubuntu and installing on another is the case that matters
  # and the case a developer's own machine never exercises.
  #
  # noble (24.04) is the BUILD host on purpose — glibc is forward- but not
  # backward-compatible, so the oldest supported release is the only safe one to
  # build on. The install is then verified on a NEWER one.
  linux:
    name: Linux daemon and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1"

      # Deliberately NOT `clang`: the Swift toolchain ships its own, and apt's
      # replaces /usr/bin/clang with an alternatives symlink to Ubuntu's LLVM,
      # which does not accept -index-store-path — every C target then fails to
      # compile. build-sqlite.sh uses `cc` (gcc), so nothing here needs apt clang.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libtorrent-rasterbar-dev libssh2-1-dev libcurl4-openssl-dev \
            libssl-dev libboost-dev libboost-system-dev libsqlite3-dev \
            pkg-config unzip

      - name: Shell scripts parse and lint
        run: |
          sudo apt-get install -y -qq shellcheck
          # dash, not bash: install.sh is `#!/bin/sh` and Ubuntu's /bin/sh IS dash,
          # so a bashism that bash accepts would only fail on a user's machine.
          dash -n website/install.sh
          # Every shell script in the repository, not a hand-picked few. Info-level
          # findings count too; an intentional one carries a `# shellcheck disable=`.
          shellcheck website/install.sh Scripts/*.sh Scripts/linux/*.sh Scripts/macos/*.sh \
            Scripts/git-hooks/pre-commit

      # GRDB needs SQLITE_ENABLE_SNAPSHOT, which Ubuntu's libsqlite3 declares
      # without defining.
      - name: Build snapshot-enabled SQLite
        run: |
          Scripts/linux/build-sqlite.sh
          echo "GOEL_SQLITE_DIR=$PWD/Vendor/linux/sqlite" >> "$GITHUB_ENV"

      - name: Cache the SwiftPM build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-${{ runner.os }}-x86_64-swift6.1-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-x86_64-swift6.1-

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Package the release tarball
        run: |
          # Tags name themselves; every other commit is an explicit off-tag build.
          if git describe --tags --exact-match >/dev/null 2>&1; then
            Scripts/linux/package_daemon.sh
          else
            GOEL_VERSION="0.0.0-ci" Scripts/linux/package_daemon.sh
          fi

      # install.sh refuses a release whose checksum it cannot fetch, so a tarball
      # published without one breaks the one-liner outright. Assert both here
      # rather than discovering it from a bug report.
      - name: The tarball and its checksum are both present and correct
        run: |
          cd dist
          tarball=$(ls goel-daemon-*-linux-*.tar.gz)
          [ -f "$tarball.sha256" ] || { echo "::error::no $tarball.sha256"; exit 1; }
          sha256sum -c "$tarball.sha256"
          for member in bin/GoelDaemon bin/goel systemd/goel.service run.sh VERSION \
                        LICENSE THIRD-PARTY-NOTICES.md; do
            tar tzf "$tarball" | grep -q "/$member\$" \
              || { echo "::error::tarball is missing $member"; exit 1; }
          done
          tar tzf "$tarball" | grep -q 'lib/libtorrent-rasterbar\.so' \
            || { echo "::error::libtorrent was not vendored — the tarball is not portable"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tarball
          path: dist/goel-daemon-*-linux-*.tar.gz*
          if-no-files-found: error

  # The install is exercised on a DIFFERENT release than the build, because that
  # is the failure this whole arrangement exists to catch. A container has no
  # systemd, so the installer's own refusal is verified there and the service
  # itself is started by the systemd-capable job below.
  linux-install:
    name: Install on a newer Ubuntu
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-tarball
          path: dist

      - name: Install, exercise the CLI, uninstall
        run: |
          set -eux
          tarball="$PWD/$(ls dist/goel-daemon-*-linux-x86_64.tar.gz)"
          sudo GOEL_TARBALL="$tarball" GOEL_PORT=8099 sh website/install.sh

          sudo goel version
          sudo goel status
          sudo goel config
          # Every doctor check must pass. It tests the things that are silent
          # otherwise: the library closure, the writable paths as the goel user,
          # the port, and whether the portal actually answers.
          sudo goel doctor
          # A real, tiny, stable target: this exercises the HTTP engine and a write
          # into the save directory without making CI depend on a large download.
          # A loopback URL would be refused by design, so it cannot be served locally.
          # NOTE: the path must be "/" — www.example.com/index.html returns 404, and
          # `goel add` would still exit 0 because queueing succeeded.
          sudo goel add https://www.example.com/
          # Queueing is asynchronous, so poll rather than sleeping a guessed interval.
          # `if`, not `&&` — under `set -e` a non-matching grep at the end of an
          # AND-list fails the step on the path where everything went right.
          for _ in $(seq 1 30); do
            if sudo goel list --all | grep -q Completed; then break; fi
            sleep 2
          done
          sudo goel list --all
          if ! sudo goel list --all | grep -q Completed; then
            echo "::error::the download never completed"; exit 1
          fi
          if sudo goel list --all | grep -q Failed; then
            echo "::error::a download failed"; exit 1
          fi
          # The bytes have to be on disk, not merely marked done in the database.
          if ! sudo test -s /var/lib/goel/downloads/www.example.com; then
            echo "::error::nothing was written into the save directory"; exit 1
          fi

          # A config change has to survive the restart it triggers.
          sudo goel config set save-dir /srv/goel-test
          sudo goel doctor
          grep -q 'srv/goel-test' /etc/systemd/system/goel.service.d/10-paths.conf

          # A system directory must be refused rather than chowned to the daemon.
          if sudo goel config set save-dir /etc; then
            echo "::error::goel accepted /etc as a download folder"; exit 1
          fi

          sudo goel uninstall --purge --yes
          # Nothing may be left behind.
          for path in /opt/goel /etc/goel /var/lib/goel /usr/local/bin/goel \
                      /etc/systemd/system/goel.service; do
            [ ! -e "$path" ] || { echo "::error::$path survived --purge"; exit 1; }
          done
          ! id goel

  # Signing, notarization and artifact upload are NOT automated: they need a
  # Developer ID certificate and a notarytool credential, neither of which
  # belongs on a hosted runner that any fork can trigger. Releases are cut by
  # hand following RELEASE.md, on a self-hosted or secret-backed runner if that
  # ever changes.
  #
  # What CAN be checked for a tag without any secret is that the tag agrees with
  # what the build would stamp — the mislabelled-release failure that
  # build_app.sh's version derivation exists to prevent. That is what this job
  # does; it makes no claim to have produced anything.
  release-readiness:
    name: Release readiness
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Tag matches the version the build would stamp
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          EXACT="$(git describe --tags --exact-match)"
          if [ "$EXACT" != "$TAG" ]; then
            echo "::error::HEAD is not exactly $TAG (git describe says '$EXACT')"
            exit 1
          fi
          echo "Tag $TAG will stamp CFBundleShortVersionString ${TAG#v}."

      - name: Licence files the bundle must carry are present
        run: |
          missing=0
          for f in LICENSE LICENSE-COMMERCIAL.md TRADEMARK.md THIRD-PARTY-NOTICES.md; do
            if [ ! -f "$f" ]; then echo "::error::$f is missing"; missing=1; fi
          done
          exit "$missing"

      - name: Remaining release steps are manual
        run: |
          echo "Signing, notarization, stapling and upload are performed by hand."
          echo "Follow RELEASE.md sections 5-7 with GOEL_RELEASE=1."
